# Regenerates web/tests/visual/baselines/ on the CI runner and commits them to the chosen branch.
# Why: baselines must come from the same Chromium CI uses (the one pinned by playwright's exact version in
# web/package.json), and a browser or dependency bump (Dependabot's playwright, lucide-react) changes every shot.
# A laptop cannot reproduce that Chromium, so the bump's branch gets its baselines from here.
# Run: Actions > "Update visual baselines" > Run workflow, pick the branch. Look at the diff in the commit before merging.
# The push uses GITHUB_TOKEN, so it does not start the other workflows: the job runs `test:visual` itself
# after writing, and main's own CI runs on merge.
name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:update
      # Writing and then checking proves the new baselines are stable on this runner.
      - run: npm run test:visual
      # A shot that differs between two runs on the same runner is unstable: say where, in the log (an artifact
      # cannot always be fetched), and keep its diff to find out why.
      - name: Say where the screenshots differ
        if: failure()
        run: |
          node -e '
            const fs = require("fs"), { PNG } = require("pngjs"), dir = "tests/visual/output"
            for (const f of fs.readdirSync(dir).filter(f => f.endsWith(".diff.png"))) {
              const d = PNG.sync.read(fs.readFileSync(`${dir}/${f}`))
              let x0 = Infinity, y0 = Infinity, x1 = -1, y1 = -1
              for (let y = 0; y < d.height; y++) for (let x = 0; x < d.width; x++) {
                const i = (y * d.width + x) * 4
                if (d.data[i] > 200 && d.data[i + 1] < 60 && d.data[i + 2] < 60) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y) }
              }
              console.log(`${f}: ${d.width}x${d.height}, differs in x ${x0}-${x1}, y ${y0}-${y1}`)
              // The two pictures of that region at half size, as base64 PNG between markers, so they can be looked at
              // from the log alone (decode with base64 -d).
              if (x1 < 0) continue
              for (const kind of ["expected", "actual"]) {
                const file = `${dir}/${f.replace(".diff.png", `.${kind}.png`)}`
                if (!fs.existsSync(file)) continue
                const src = PNG.sync.read(fs.readFileSync(file))
                const w = Math.ceil((x1 - x0 + 1) / 2), h = Math.ceil((Math.min(y1, src.height - 1) - y0 + 1) / 2)
                const out = new PNG({ width: w, height: h })
                for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
                  const s = ((y0 + 2 * y) * src.width + x0 + 2 * x) * 4, o = (y * w + x) * 4
                  for (let c = 0; c < 4; c++) out.data[o + c] = src.data[s + c]
                }
                console.log(`--- ${kind} ${f} ---`)
                console.log(PNG.sync.write(out).toString("base64"))
                console.log(`--- end ---`)
              }
            }'
      - name: Upload screenshots that differ
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: web/tests/visual/output/
      - name: Commit the baselines
        working-directory: .
        run: |
          git add web/tests/visual/baselines
          if git diff --cached --quiet; then echo "baselines unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update visual baselines (Chromium $(npx --prefix web playwright --version))"
          git push
